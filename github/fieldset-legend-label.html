<DOCTYPE html>
<html lang="pt_br">
    <head>
       <meta charset="UTF-8"> 
       <title>FORMS1</title>
       <style>
        ::before,
        ::after {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }
        .clear {
            clear:both;
        }
        body {
            width: 100%;
            max-width: 1200px;
            min-width: 860px;
            margin: 0 auto;
            background-color: #fff;
        }
        h1,h2,h3,h4,h5,h6 {
            color: #036;
        }
        .topo header {
            background-color: #036;
            padding: 5 px 20 px;
        }
        .topo header a {
            color:#fff;
            margin: 4 px 0 2px 0;
        }
        .topo header h2 {
            font-size: 20px;
            margin: 2px 0 4px 0;
            color: #fff;
        }
        .principal {
            width: 100%;
            padding: 20px 15px;
        }
        .rodape {
            background-color: #036;
            color: #fff;
            padding: 5px 0;
            text-align: center;
        }
        pre {
            font-size: 14px;
        }
        @media (max-width: 1040px) {
            pre {
                font-size: 12px;
            }
        }
    </style>
    </head>
    <body class="home">
        <div id="tudo">
            <div class="topo">
                <header class="topo_header">
                    <hgroup>
                        <h1><a href="*">Formulários</a></h1>
                        <h2>Elementos e atributos</h2>
                    </hgroup>    
                </header>
            </div>
        </div> <!--topo-->

        <div class="principal">
            <main>
                <section>
                    <h1>Elementos fieldset, legend e label</h1>

                    <form action="" method="">
                        <fieldset>
                            <legend>Dados Pessoais</legend>
                            <p><small>Campos com rótulo</small></p>
                            <label>Nome<input type="text" name="nome"></label>
                            <label>Sobrenome<input type="text" name="sobrenome"></label>
                            <label>Email<input type="text" name="email"></label>
                        </fieldset>
                        <fieldset>
                            <legend>Suas Preferências</legend>
                            <p><small>Campos com rótulo explicado</small></p>
                            <label for="livro"></label>
                            <label>Livro<input type="text"id="Livro"></label>
                            <label for="filme"></label>
                            <label>Filme<input type="text"id="filme"></label>
                            <label for="esporte"></label>
                            <labe>Esporte<input type="text"id="esporte"></label>
                        </fieldset>    
                    </form>
                </section>
            </main>
        </div>
        <div class="rodape">
            <footer>
                <small>Site de Apoio HTML e CSS</small>
            </footer>
        </div>
    </body>    
</html>
